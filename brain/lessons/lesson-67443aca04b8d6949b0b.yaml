  source_masked: "create PROCEDURE SCHEMA_1.PROC_7\n( \n  @PARAM_24 int\n  ,\n@PARAM_25 varchar(10)\n\
    \  ,\n@PARAM_26 tinyint\n)\n//*************************************************\n//SIR #26209 Created\
    \ by Kozlovsky 02.08.2021\n// Prepared: 01.10.2021 By Gritsenko\n// SIR: #22336 File : WEBR3_008.sql\n\
    //*************************************************\n RESULT\n( \n   COL_12 int\n   ,\nCOL_20 int\n\
    \   ,\nCOL_18 varchar(10)\n   ,\nCOL_19 long varchar\n   ,\nCOL_22 int\n   ,\nCOL_21 int\n)\nBEGIN\n\
    \    CASE\n        WHEN @PARAM_26 = 1 THEN\n  SELECT  \n    ISNULL(SCHEMA_2.COL_13,-1) as COL_12\n\
    \    ,\n    PUT.COL_13 as COL_20\n    ,\n    PUT.COL_10 as COL_18\n    ,\n    'TEXT_LITERAL_1' ||\
    \ PUT.COL_11 as COL_19\n    ,\n    (IF ISNULL(SCHEMA_2.COL_8,-1)<0 then 0\n    else 1\nend IF) as\
    \ COL_22\n    ,\n    (IF ISNULL(SCHEMA_2.COL_9,-1)<0 then 0\n    else 1\nend IF) as COL_21\nFROM\n\
    \    SCHEMA_1.TBL_4 PUT\nFULL JOIN  \n  (\n    SELECT\n        PU.COL_13\n    ,\n        PU.COL_8\
    \ \n    ,\n        PU.COL_9,\n        PU.COL_23\n    FROM\n        SCHEMA_1.TBL_5 PU\n    JOIN SCHEMA_1.TBL_3\
    \ PRT\n    ON\n        PRT.COL_16 = PU.COL_8\n    WHERE\n        PU.COL_14 = @PARAM_24\n        and\
    \ PRT.COL_15 = @PARAM_25)X\n    ELSE\n  SELECT  \n    ISNULL(SCHEMA_2.COL_13,-1) as COL_12\n    ,\n\
    \    PUT.COL_13 as COL_20\n    ,\n    PUT.COL_10 as COL_18\n    ,\n    'TEXT_LITERAL_1' || PUT.COL_11\
    \ as COL_19\n    ,\n    (IF ISNULL(SCHEMA_2.COL_8,-1)<0 then 0\n    else 1\nend IF) as COL_22\n  \
    \  ,\n    (IF ISNULL(SCHEMA_2.COL_9,-1)<0 then 0\n    else 1\nend IF) as COL_21\nFROM\n    SCHEMA_1.TBL_4\
    \ PUT\nFULL JOIN  \n  (\n    SELECT\n        PU.COL_13\n    ,\n        PU.COL_8 \n    ,\n        PU.COL_9\n\
    \    ,\n        PU.COL_23\n    FROM\n        SCHEMA_1.TBL_5 PU\n    JOIN SCHEMA_1.TBL_3 PRT\n    ON\n\
    \        PRT.COL_16 = PU.COL_8\n    WHERE\n        COL_17 = @PARAM_24\n        and PRT.COL_15 = @PARAM_25)X\n\
    END\nEND;"
  generated_masked: "CREATE OR REPLACE FUNCTION SCHEMA_1.PROC_7(\n\t@PARAM_24 INTEGER\n\t\n\t, @PARAM_25\
