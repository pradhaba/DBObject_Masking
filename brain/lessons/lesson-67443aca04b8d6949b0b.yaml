    \ ALIAS_2\n\t\t\tJOIN SCHEMA_1.TBL_3 ALIAS_3\n\t\t\tON\n\t\t\tALIAS_3.COL_16 = SCHEMA_3.TBL_1\n\t\t\
    \tWHERE\n\t\t\tSCHEMA_3.COL_14 = @PARAM_24\n\t\t\tAND ALIAS_3.COL_15 = @PARAM_25)X;\n\t\tELSE\n\t\t\
    RETURN QUERY\n\t\tSELECT\n\t\t\tCOALESCE(SCHEMA_2.COL_13,-1) AS COL_12\n\t\t\t, SCHEMA_4.COL_13 AS\
    \ COL_20\n\t\t\t, SCHEMA_4.COL_10::TEXT AS COL_18\n\t\t\t, ('TEXT_LITERAL_1' || SCHEMA_4.COL_11)::TEXT\
    \ AS COL_19\n\t\t\t, (CASE WHEN COALESCE(SCHEMA_2.TBL_1,-1)<0 THEN 0 ELSE 1 END) AS COL_22\n\t\t\t\
    , (CASE WHEN COALESCE(SCHEMA_2.TBL_2,-1)<0 THEN 0 ELSE 1 END) AS COL_21\n\t\tFROM SCHEMA_1.TBL_4 ALIAS_1\n\
    \t\t\tFULL JOIN\n\t\t\t(\n\t\t\t\tSELECT\n\t\t\t\tSCHEMA_3.COL_13\n\t\t\t\t\n\t\t\t\t, SCHEMA_3.TBL_1\n\
    \t\t\t\t\n\t\t\t\t, SCHEMA_3.TBL_2\n\t\t\t\t\n\t\t\t\t, SCHEMA_3.TBL_6\n\t\t\t\tFROM SCHEMA_1.TBL_5\
    \ ALIAS_2\n\t\t\t\tJOIN SCHEMA_1.TBL_3 ALIAS_3\n\t\t\t\tON\n\t\t\t\tALIAS_3.COL_16 = SCHEMA_3.TBL_1\n\
    \t\t\t\tWHERE\n\t\t\t\tSCHEMA_3.COL_17 = @PARAM_24\n\t\t\t\tAND ALIAS_3.COL_15 = @PARAM_25)X;\n\t\
    END;\nEND;\n$$;\n"
  corrected_masked: "CREATE OR REPLACE FUNCTION SCHEMA_1.PROC_7(\n    @PARAM_24 integer,\n    @PARAM_25\
    \ text,\n    @PARAM_26 integer\n)\nRETURNS TABLE (\n    COL_12 integer,\n    COL_20 integer,\n   \
    \ COL_18 text,\n    COL_19 text,\n    COL_22 integer,\n    COL_21 integer\n)\nLANGUAGE sql\nAS $function$\n\
    WITH x AS (\n\tSELECT SCHEMA_4.COL_13, SCHEMA_4.TBL_1, SCHEMA_4.TBL_2, SCHEMA_4.TBL_6\n\tFROM SCHEMA_1.TBL_5\
    \ ALIAS_1\n\tJOIN SCHEMA_1.TBL_3 ALIAS_2\n\t\tON SCHEMA_3.COL_16 = SCHEMA_4.TBL_1\n\tWHERE \n\t\t\
    (CASE @PARAM_26\n\t\t\tWHEN 1 THEN\n\t\t\tSCHEMA_4.COL_14\n\t\tELSE\n\t\t\tSCHEMA_4.COL_17\n\t\tEND)\
    \ = @PARAM_24\n\t\tAND SCHEMA_3.COL_15 = @PARAM_25\n),\njoined AS (\n\tSELECT  \n\t\tCOALESCE(SCHEMA_2.COL_13,\
    \ -1) AS COL_12,\n\t\tALIAS_3.COL_13::integer AS COL_20,\n\t\tALIAS_3.COL_10::text AS COL_18,\n\t\t\
    'TEXT_LITERAL_1' || ALIAS_3.COL_11::text AS COL_19,\n\t\tCASE WHEN COALESCE(SCHEMA_2.TBL_1, -1) <\
    \ 0 THEN 0 ELSE 1 END AS COL_22,\n\t\tCASE WHEN COALESCE(SCHEMA_2.TBL_2, -1) < 0 THEN 0 ELSE 1 END\
    \ AS COL_21\n\tFROM SCHEMA_1.TBL_4 ALIAS_3\n\tFULL JOIN x\n\t\tON ALIAS_3.COL_13 = SCHEMA_2.TBL_2\n\
    )\nSELECT j.COL_12, j.COL_20, j.COL_18, j.COL_19, j.COL_22, j.COL_21\nFROM joined as j;\n$function$;"
