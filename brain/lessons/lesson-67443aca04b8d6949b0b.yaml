    \t\n\t, COL_18 TEXT\n\t\n\t, COL_19 TEXT\n\t\n\t, COL_22 INTEGER\n\t\n\t, COL_21 INTEGER\n)\nLANGUAGE\
    \ sql\nAS $function$\nBEGIN\n\tCASE\n\t\tWHEN @PARAM_26 = 1 THEN\n\tRETURN QUERY\n\tSELECT\n\t\tCOALESCE(SCHEMA_2.COL_13,-1)\
    \ AS COL_12 /* MIGRATION REVIEW [COLUMN_METADATA_NOT_FOUND]: datatype unidentified; original expression\
    \ preserved */\n\t\t, SCHEMA_4.COL_13 AS COL_20\n\t\t, SCHEMA_4.COL_10::TEXT AS COL_18\n\t\t, ('TEXT_LITERAL_1'\
    \ || SCHEMA_4.COL_11)::TEXT AS COL_19\n\t\t, (CASE WHEN COALESCE(SCHEMA_2.TBL_1,-1)<0 THEN 0 ELSE\
    \ 1 END) AS COL_22\n\t\t, (CASE WHEN COALESCE(SCHEMA_2.TBL_2,-1)<0 THEN 0 ELSE 1 END) AS COL_21\n\t\
    FROM SCHEMA_1.TBL_4 ALIAS_1\n\t\tFULL JOIN\n\t\t(\n\t\t\tSELECT\n\t\t\tSCHEMA_3.COL_13\n\t\t\t\n\t\
