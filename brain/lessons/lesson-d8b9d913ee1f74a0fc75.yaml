    \t\tWHERE\n\t\t\tALIAS_2.COL_17 = @PARAM_18;\n\n\t\t\tSELECT 0 INTO SCHEMA_1.@VAR_20;\n\t\tELSE\n\n\
    \t\t\tSELECT\n\t\t\t-4\n\t\t\tINTO\n\t\t\t@VAR_20;\n\t\tEND IF;\n\n\tELSE\n\n\t\tSELECT\n\t\t-3\n\t\
    \tINTO\n\t\t@VAR_20;\n\tEND IF;\nELSE\n\n\tSELECT\n\t-2\n\tINTO\n\t@VAR_20;\nEND IF;\n\nRETURN QUERY\n\
    SELECT @VAR_20;\nEND;\n$function$;"
  corrected_masked: "CREATE OR REPLACE FUNCTION SCHEMA_1.PROC_5(IN @PARAM_18 INTEGER)\nRETURNS INTEGER\n\
    LANGUAGE plpgsql\nAS $function$\nDECLARE\n    @VAR_20 INTEGER := -1;\n    @VAR_19 INTEGER := 0;\n\
    \    check_val INTEGER;\nBEGIN\n\tIF SCHEMA_1.sf_check_mode('TEXT_LITERAL_1', @PARAM_18::text, 'TEXT_LITERAL_2',\
    \ 'TEXT_LITERAL_2', 'TEXT_LITERAL_2') = 0 THEN\n\t\tSELECT ALIAS_1.security_status\n\t\tINTO @VAR_19\n\
    \t\tFROM SCHEMA_1.TBL_1 AS ALIAS_1\n\t\tWHERE ALIAS_1.COL_6 = 'TEXT_LITERAL_3';\n\t\n\t\tIF COALESCE(@VAR_19,\
    \ 0) = 1 THEN\n\t\t\tSELECT CASE\n\t\t\t\t\tWHEN ALIAS_2.COL_7 > 0 AND ALIAS_2.COL_8 = 'TEXT_LITERAL_4'\
    \ THEN 3\n\t\t\t\t\tWHEN ALIAS_2.COL_7 > 0 AND ALIAS_2.COL_8 = 'TEXT_LITERAL_6' THEN 1\n\t\t\t\t\t\
    WHEN ALIAS_2.COL_7 IS NULL THEN 0\n\t\t\t\tEND\n\t\t\tINTO check_val\n\t\t\tFROM SCHEMA_1.TBL_4 AS\
    \ ALIAS_2\n\t\t\tWHERE ALIAS_2.COL_17 = @PARAM_18;\n\t\n\t\t\tIF check_val < 3 THEN\n\t\t\t\tDELETE\
    \ FROM SCHEMA_1.TBL_4 AS ALIAS_2\n\t\t\t\tWHERE ALIAS_2.COL_17 = @PARAM_18;\n\t\t\t\t@VAR_20 := 0;\n\
    \t\t\tELSE\n\t\t\t\t@VAR_20 := -4;\n\t\t\tEND IF;\n\t\tELSE\n\t\t\t@VAR_20 := -3;\n\t\tEND IF;\n\t\
    ELSE\n\t\t@VAR_20 := -2;\n\tEND IF;\n\n\tRETURN @VAR_20;\nEND;\n$function$;"
