    \ = TBL_1.COL_29 )\n        and \n\t\t\t( TBL_4.COL_44 = TBL_7.COL_44 )\n        and\n         ( (\
    \ TBL_1.COL_29 = @PARAM_48\n            and @PARAM_54 = 'TEXT_LITERAL_6' )\n        or \n        \
    \   ( @PARAM_54 = 'TEXT_LITERAL_7'\n            and TBL_1.COL_29 in (\n            Select\n      \
    \          COL_29\n            From\n                TBL_4 \"fam\"\n            Where\n          \
    \      \"fam\".COL_21 = COL_28 ) )\n        or \n           ( @PARAM_48 = 0 ) )\n        and\n\t\t\
    \t( @PARAM_49 = 999\n            or ( TBL_1.COL_32 = @PARAM_49\n                and @PARAM_49 > 0)\
    \ )\n        and\n         ( (COL_17(TBL_1.COL_43) >= @PARAM_51\n            and COL_17(TBL_1.COL_43)\
    \ <= @PARAM_52 )\n            OR @PARAM_53 = 9)\n        and\n\t\t(\n\t\t\t(UPPER(TBL_1.COL_40 ) =\
    \ UPPER(@PARAM_55)\n            AND (TBL_1.COL_12 = 'TEXT_LITERAL_2'\n                or TBL_1.COL_12\
    \ is null))\n        or (@PARAM_55 = 'TEXT_LITERAL_8')\n            or (@PARAM_55 = 'TEXT_LITERAL_9'\n\
    \                and UPPER(TBL_1.COL_12 ) = 'TEXT_LITERAL_10')\n                or (@PARAM_55 = 'TEXT_LITERAL_11'\n\
    \                    and UPPER(TBL_1.COL_12 ) = 'TEXT_LITERAL_12')\n\t\t)\n        and\n         (\
    \ COL_25 = @PARAM_50\n            OR @PARAM_50 = 'TEXT_LITERAL_13')\n    END;"
