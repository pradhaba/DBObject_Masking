    \        Select\n            TOP 1 TBL_9.COL_45\n        From\n            TBL_5 ,\n            TBL_6\
    \ ,\n            TBL_9\n        Where\n            COL_29 in (\n            Select\n             \
    \   COL_29\n            From\n                TBL_4 \"fam\"\n            Where\n                \"\
