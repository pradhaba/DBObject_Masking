  source_masked: "create PROCEDURE SCHEMA_1.PROC_9(in PARAM_54 integer, in PARAM_52 date, in PARAM_53\
    \ date, in PARAM_56 integer, in PARAM_57 integer, in PARAM_55 integer default COL_10)\nresult(COL_24\
    \ integer, COL_25 date, COL_28 integer, COL_30 char(3), COL_31 char(30), COL_26 char(22), COL_29 char(15),\
    \ COL_32 char(10), COL_27 char(COL_11), COL_33 char(200), COL_45 date, COL_48 integer, COL_44 char(16),\
    \ COL_49 char(30), COL_46 char(22), COL_47 char(15), COL_50 char(10), COL_51 char(200))\nbegin\n \
    \   //*********************\n    // Purpose:   Report 'TEXT_LITERAL_1'\n    // ********************\n\
    \    // Parameters:\n    //\tPARAM_54\t\t-- not used (for future)\n    //\tPARAM_52\t--\tApp period\
    \ start date (date of booking)\n    //\tPARAM_53\t--\tApp period end date  (date of booking)\n   \
    \ //\tPARAM_56 = TBL_8.COL_39\n    //\tPARAM_55\t- Practice id (-COL_11 = ALL) not used (for future)\n\
    \    // ********************\n    // Return values:\n    //\tCOL_24 integer\n    //\tCOL_25 date\n\
    \    //\tCOL_28 integer\n    //\tCOL_30 char(3)\n    //\tCOL_31 char(30)\n    //\tCOL_26 char(22)\n\
    \    //\tCOL_29 char(15)\n    //\tCOL_32 char(10)\n    //\tCOL_27 char(COL_11)\n    //\tCOL_33 char(200)\n\
    \    //\n  //\tCOL_45 date\n    //\tCOL_48\tinteger\n    //\tCOL_44 char(16)\n    //\tCOL_49 char(30)\n\
    \    //\tCOL_46 char(22)\n    //\tCOL_47 char(15)\n    //\tCOL_50 char(10)\n    //\tCOL_51 char(200)\n\
    \    // ********************\n    // Remarks:\n    // ********************\n    // Created:\t\t\t\t\
    26.01.2004\t\tBy:  Pozdeev\n    // ********************\n    // Modified:\t \t\t\t26.01.2004\t\tBy:\
    \  Pozdeev\n    // What:  \t\t\t\tSIR# DT00001240\t\tCreated\n    // ********************\n    //\
    \ Modified:\t \t\t\t25.04.2005\t\tBy:  Pershin\n    // What:  \t\t\t\tSIR# DT00002420 Appointed by\
    \ Report - more filters \t\t\n    // ********************\n    //Modified:\t10.12.2020\n    //Who:\t\
    Vladimir Soloviev\n    //SIR:\tDT00026155, POTP_04.SQL\n    //What: adaptation for potential TBL_3,\
    \ fixed by #DT00027153\n    //*********************\n    //\n  select TBL_1.COL_16 as COL_24,\n  \
    \  min(\"date\"(TBL_2.COL_17)) as COL_25,\n    min(TBL_7.COL_22) as COL_28,\n    min(TBL_7.COL_37),\n\
    \    min(TBL_7.COL_40),\n    min(TBL_7.COL_19),\n    min(TBL_7.COL_23),\n    (\n    select\n     \
    \   TBL_4.COL_42\n    from\n        TBL_4\n    where\n        TBL_4.COL_41 = min(TBL_7.COL_41)),\n\
    \    min(TBL_7.COL_21),\n    SCHEMA_1.sf_get_provider_info(COL_28,\n    COL_11,\n    VAR_58,\n   \
    \ COL_10),\n    //COL_11=(Code)+Title+COL_40+COL_19+COL_23,,,, COL_10=(other_staff-not used)\n   \
    \ //\n    min(TBL_1.COL_15) as COL_45,\n    min(Coalesce(- TBL_5.COL_38, TBL_3.COL_35)) as COL_48,\n\
    \    //10.12.2020 Vladimir Soloviev SIR #DT00026155 add Coalesce...\n    (If COL_48 < COL_10 Then\
    \ 'TEXT_LITERAL_2'\n    Else min(TBL_3.COL_36)\nEnd If),\n    //10.12.2020 Vladimir Soloviev SIR #DT00026155\
    \ add If...\n    (If COL_48 < COL_10 Then min(TBL_6.COL_40)\n    Else min(TBL_3.COL_40)\nEnd If),\n\
    \    //10.12.2020 Vladimir Soloviev SIR #DT00026155 add If...\n    (If COL_48 < COL_10 Then min(TBL_6.COL_19)\n\
    \    Else min(TBL_3.COL_19)\nEnd If),\n    //10.12.2020 Vladimir Soloviev SIR #DT00026155 add If...\n\
    \    (If COL_48 < COL_10 Then min(TBL_6.COL_23)\n    Else min(TBL_3.COL_23)\nEnd If),\n    //10.12.2020\
    \ Vladimir Soloviev SIR #DT00026155 add If...\n    (\n    select\n        TBL_4.COL_42\n    from\n\
    \        TBL_4\n    where\n        TBL_4.COL_41 = (If COL_48 < COL_10 Then min(TBL_6.COL_41)\n   \
    \     Else min(TBL_3.COL_41)\n    End If)),\n    //10.12.2020 Vladimir Soloviev SIR #DT00026155 add\
    \ If...\n    SCHEMA_1.sf_get_patient_info(COL_48,\n    COL_11,\n    VAR_58)\nfrom\n    //COL_11=Code+Title+COL_40+COL_19+COL_23\n\
    \    TBL_1\nleft outer join TBL_2 on\n    (TBL_1.COL_16 = TBL_2.COL_16 and TBL_2.COL_43 = COL_10),\n\
    \    TBL_2\nleft outer join TBL_7 on\n    (TBL_2.COL_22 = TBL_7.COL_22),\n    TBL_1\nleft outer join\
    \ TBL_3 on\n    (TBL_1.COL_34 = TBL_3.COL_35),\n    TBL_1\nleft outer join TBL_5 on\n    (TBL_1.COL_18\
    \ = TBL_5.COL_18),\n    //10.12.2020 Vladimir Soloviev SIR #DT00026155\n    TBL_5\nleft outer join\
    \ TBL_6 on\n    TBL_6.COL_35 = TBL_5.COL_38,\n    //17.03.2020 Vladimir Soloviev SIR #DT00027153\n\
    \    TBL_8 wt_1,\n    TBL_8 wt_2\nwhere\n    PARAM_56 = wt_1.COL_39\n    and\n\t PARAM_57 = wt_2.COL_39\n\
    \    and\n    TBL_7.COL_22 = wt_1.COL_20\n    and\n\t COL_14 = wt_2.COL_20\n    and\n    \"date\"\
    (TBL_2.COL_17) between PARAM_52 and PARAM_53\n    and\n    TBL_1.COL_16 > COL_10\ngroup by\n    TBL_1.COL_16\n\
    \    //\\\\\nend;"
  generated_masked: "CREATE OR REPLACE FUNCTION SCHEMA_1.PROC_9(IN PARAM_54 INTEGER, IN PARAM_52 DATE,\
