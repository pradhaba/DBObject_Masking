    \ END))::TEXT,\n\t\t((CASE WHEN (MIN(COALESCE(- ALIAS_6.COL_38, ALIAS_5.COL_35))) < COL_10 THEN MIN(ALIAS_7.COL_19)\
    \ ELSE MIN(ALIAS_5.COL_19) END))::TEXT,\n\t\t((CASE WHEN (MIN(COALESCE(- ALIAS_6.COL_38, ALIAS_5.COL_35)))\
