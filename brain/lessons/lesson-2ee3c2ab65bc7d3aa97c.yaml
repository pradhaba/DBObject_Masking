    \ JOIN SCHEMA_1.TBL_3 AS ALIAS_5 ON\n\t(ALIAS_2.COL_34 = ALIAS_5.COL_35)\n\tLEFT OUTER JOIN SCHEMA_1.TBL_5\
    \ AS ALIAS_6 ON\n\t(ALIAS_2.COL_18 = ALIAS_6.COL_18)\n\tLEFT OUTER JOIN SCHEMA_1.TBL_6 AS ALIAS_7\
    \ ON\n\tALIAS_7.COL_35 = ALIAS_6.COL_38\n\tCROSS JOIN SCHEMA_1.TBL_8 ALIAS_8\n\tCROSS JOIN SCHEMA_1.TBL_8\
    \ ALIAS_9\n\tWHERE\n\tPARAM_56 = ALIAS_8.COL_39\n\t\tAND\n\tPARAM_57 = ALIAS_9.COL_39\n\t\tAND\n\t\
    ALIAS_4.COL_22 = ALIAS_8.COL_20\n\t\tAND\n\tCOL_14 /* MIGRATION REVIEW [UNQUALIFIED_COLUMN_REVIEW]:\
