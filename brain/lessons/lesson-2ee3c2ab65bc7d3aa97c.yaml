    ALIAS_1.COL_42\n\t\tFROM SCHEMA_1.TBL_4 AS ALIAS_1\n\t\tWHERE\n\t\tALIAS_1.COL_41 = (CASE WHEN (MIN(COALESCE(-\
    \ ALIAS_6.COL_38, ALIAS_5.COL_35))) < COL_10 THEN MIN(ALIAS_7.COL_41) ELSE MIN(ALIAS_5.COL_41) END)))::TEXT,\n\
    \t\t(SCHEMA_1.sf_get_patient_info((MIN(COALESCE(- ALIAS_6.COL_38, ALIAS_5.COL_35))),\n\t\tCOL_11,\n\
    \t\tSCHEMA_1.get_int_var('TEXT_LITERAL_3')))::TEXT\n\tFROM SCHEMA_1.TBL_1 AS ALIAS_2\n\tLEFT OUTER\
    \ JOIN SCHEMA_1.TBL_2 AS ALIAS_3 ON\n\t(ALIAS_2.COL_16 = ALIAS_3.COL_16 AND ALIAS_3.COL_43 = COL_10)\n\
