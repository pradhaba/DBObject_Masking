  source_masked: "create PROCEDURE SCHEMA_1.PROC_9(IN @PARAM_31 integer)\n// ******************************************************\n\
    // Created: 09.02.2022 By: Yuri Shchelkanov\n// SIR:     #29880\n// What:\tGet TBL_6 permitted TBL_1\n\
    // Prepared: 24.03.2022 By Gritsenko\n// SIR: #22336 File : WEBR3_048.sql\n// ******************************************************\n\
    // Modified: 13.07.2022 By Gritsenko\n// What:\tusing COL_13, COL_17 ,COL_19 instead of action_name,\
    \ mode_name ,module_name\n// SIR #31004\n// Prepared: 12.07.2022 By Gritsenko\n// SIR: #22336 File\
    \ : WEBR3_075.sql\n// ******************************************************\nBEGIN\n    SELECT\n\
    \    TBL_1.COL_13 as \"action_name\",   \n         TBL_3.COL_17 as \"mode_name\",   \n         TBL_4.COL_19\
    \ as \"module_name\",   \n         TBL_4.COL_21 as \"modules_order_num\",   \n         TBL_3.COL_21\
    \ as \"modes_order_num\",   \n         TBL_1.COL_21 as \"actions_order_num\",   \n         TBL_6.COL_10,\
    \   \n         TBL_6.COL_28,   \n         ifnull(TBL_5.COL_26, TBL_6.COL_29, TBL_5.COL_26 + 'TEXT_LITERAL_1'\
    \ + TBL_5.COL_15) as COL_29,   \n         TBL_1.COL_14,\n    TBL_1.COL_11,\n         TBL_3.COL_16,\n\
    \         TBL_4.COL_18\nFROM\n    SCHEMA_1.TBL_6,\n    SCHEMA_1.TBL_5,\n    SCHEMA_1.TBL_1,\n    SCHEMA_1.TBL_3,\n\
    \         SCHEMA_1.TBL_4 /* 20.09.2002 Isaev */,\n    SCHEMA_1.TBL_2 /* Isaev */\nWHERE\n    ( TBL_6.COL_28\
    \ = @PARAM_31 )\n    AND  \n         ( TBL_3.COL_18 = TBL_4.COL_18 )\n    AND\n         ( TBL_1.COL_16\
    \ = TBL_3.COL_16 )\n    AND\n         ( TBL_6.COL_28 *= TBL_5.COL_24)\n    AND\n         ( TBL_6.COL_10\
    \ is null )\n    AND\n    //( TBL_1.COL_30= 1 /*Pozdeev 30.03.2006*/ ) AND\n\t\t( sf_secure_get_action_visible(TBL_1.COL_11,\
    \ TBL_1.COL_30) = 1 )\n    AND\n\t\t( TBL_1.COL_14 = 0\n        or (TBL_1.COL_14 = 1\n           \
    \ AND\n\t\texists (\n            SELECT\n                *\n            FROM\n                SCHEMA_1.TBL_1\
    \ \"actions2\"\n            WHERE\n                \"actions2\".COL_16 = TBL_1.COL_16\n          \
    \      AND \"actions2\".COL_14 = 0\n                AND (\"actions2\".COL_25 in (0, 2)\n         \
    \           or exists (\n                    SELECT\n                        *\n                 \
    \   FROM\n                        SCHEMA_1.TBL_8,\n                        SCHEMA_1.TBL_7,\n     \
    \                   SCHEMA_1.TBL_6 \"users2\"\n                    WHERE\n                       \
    \ ( TBL_8.COL_12 = \"actions2\".COL_12 )\n                            AND ( \"users2\".COL_28 = TBL_8.COL_28\
    \ )\n                                AND ( TBL_7.COL_27 = \"users2\".COL_28 )\n                  \
    \                  and ( TBL_7.COL_28 = @PARAM_31 )\n                                        AND (\
    \ \"users2\".COL_10 is null ) )\n                        or exists (\n                        SELECT\n\
    \                            *\n                        FROM\n                            SCHEMA_1.TBL_8\n\
    \                        WHERE\n                            ( TBL_6.COL_28 = TBL_8.COL_28 )\n    \
    \                            AND ( TBL_8.COL_12 = \"actions2\".COL_12 ) )))) )\n    AND\t\n      \
    \   ( TBL_1.COL_25 in (0, 2)\n        or exists (\n        SELECT\n            *\n        FROM\n \
    \           TBL_8,\n            TBL_7,\n            TBL_6 \"users2\"\n        WHERE\n            (\
    \ TBL_8.COL_12 = TBL_1.COL_12 )\n                AND ( \"users2\".COL_28 = TBL_8.COL_28 )\n      \
    \              AND ( TBL_7.COL_27 = \"users2\".COL_28 )\n                        and ( TBL_7.COL_28\
    \ = @PARAM_31 )\n                            AND ( \"users2\".COL_10 is null ) )\n            or exists\
    \ (\n            SELECT\n                *\n            FROM\n                SCHEMA_1.TBL_8\n   \
    \         WHERE\n                ( TBL_6.COL_28 = TBL_8.COL_28 )\n                    AND ( TBL_8.COL_12\
    \ = TBL_1.COL_12 ) ) ) /* 20.09.2002 Isaev */\n    AND\n         ( TBL_2.COL_22 IS NULL\n        AND\n\
    \           TBL_2.COL_20 = TBL_3.COL_16\n        AND\n           TBL_2.COL_23 = 'TEXT_LITERAL_2')\n\
    \    // Isaev\nEND;"
