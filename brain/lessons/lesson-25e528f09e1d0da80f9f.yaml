    \   File: WEB_175.sql\n    // ********************    \n    // Modified: 10.10.2019\tBy: Migaenko\n\
    \    // SIR#      #23416\n    // Prepared: 15.10.2019  By: Gritsenko\n    // SIR:      #22336   FILE:\
    \ WEB_182.sql\n    // ********************\n    \tSELECT\n    FIRST TBL_2.COL_9,\n    TBL_2.COL_8,\n\
    \    TBL_2.COL_7\n\t\tINTO\n    @PARAM_11,\n    @PARAM_13,\n    @PARAM_12\nFROM\n    SCHEMA_1.TBL_2,\n\
    \    SCHEMA_1.TBL_1\nWHERE\n    TBL_2.COL_6 = TBL_1.COL_6\n    AND TBL_1.COL_5 = 4\n    AND TBL_2.COL_4\
    \ = @PARAM_10;\nEND;"
