    OUT @PARAM_13 TEXT,\nOUT @PARAM_12 INTEGER)\nLANGUAGE PLPGSQL\nAS $$\nBEGIN\n\n\tSELECT ALIAS_1.COL_9,\n\
    \tALIAS_1.COL_8,\n\tALIAS_1.COL_7\n\tINTO\n\t@PARAM_11,\n\t@PARAM_13,\n\t@PARAM_12\n\tFROM SCHEMA_1.TBL_2\
    \ AS ALIAS_1\n\tJOIN SCHEMA_1.TBL_1 AS ALIAS_2 ON ALIAS_1.COL_6 = ALIAS_2.COL_6\n\tWHERE\n\tALIAS_2.COL_5\
    \ = 4\n\tAND ALIAS_1.COL_4 = @PARAM_10\n\tLIMIT 1;\nEND;\n$$;\n"
  corrected_masked: "CREATE OR REPLACE FUNCTION SCHEMA_1.PROC_3(\n\t@PARAM_10 text\n)\nRETURNS TABLE(\n\
