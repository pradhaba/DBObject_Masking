  source_masked: "create PROCEDURE SCHEMA_1.PROC_7(IN @PARAM_40 INTEGER)\nBEGIN\n    declare @VAR_41 INTEGER;\n\
    \nSELECT\n    COL_9\ninto\n    @VAR_41\nFROM\n    SCHEMA_1.TBL_2\nwhere\n    COL_8 = @PARAM_40;\n\n\
    SELECT \n         TBL_2.COL_16 as x_account_id,\n         TBL_6.COL_13 as x_staff_first_name,\n  \
    \       TBL_6.COL_35 as x_staff_last_name,\n         TBL_2.COL_38 as x_amount,\n         TBL_2.COL_10\
    \ as x_deposit_amount,\n        'TEXT_LITERAL_1' as x_product,\n         TBL_2.COL_24 as x_reference,\n\
    \         TBL_1.COL_39 as x_vip_number,\n         ( Case\n        when TBL_4.COL_37 in ('TEXT_LITERAL_2',\
    \ 'TEXT_LITERAL_3', 'TEXT_LITERAL_4', 'TEXT_LITERAL_5', 'TEXT_LITERAL_6') \n           Then TBL_4.COL_37\n\
    \        Else ( Case\n            when TBL_4.COL_20 = 'TEXT_LITERAL_7' then 'TEXT_LITERAL_2'\n   \
    \         when TBL_4.COL_20 = 'TEXT_LITERAL_8' then 'TEXT_LITERAL_4'\n            else 'TEXT_LITERAL_9'\n\
    \        end)\n    end ) as x_customer_title, \n         TBL_3.COL_13 as x_customer_first_name,\n\
    \         left(TBL_3.COL_17, 1) as x_customer_middle_initial,\n         TBL_3.COL_35 as x_customer_last_name,\n\
    \         TBL_3.COL_12 as x_customer_email,\n         TBL_3.COL_18 as x_customer_mobile_phone,\n \
    \        TBL_3.COL_21 as x_customer_home_phone,\n         TBL_3.COL_11 as x_customer_dob, \n     \
    \    TBL_2.COL_25,   \n         TBL_2.COL_30 as x_reference2,\n         TBL_2.COL_27 as x_currency,\n\
    \         TBL_2.COL_32 as x_test,   \n         TBL_2.COL_26 as x_amount2,   \n         TBL_2.COL_28\
    \ as x_gateway_reference,   \n         TBL_2.COL_33 x_timestamp ,      \n         TBL_2.COL_31 as\
    \ x_result,   \n         TBL_2.COL_29 x_message,   \n         TBL_2.COL_34\nFROM\n    SCHEMA_1.TBL_2\n\
    left outer join SCHEMA_1.TBL_6 on\n    TBL_6.COL_15 = TBL_2.COL_23\nleft outer join SCHEMA_1.TBL_3\
    \ on\n    TBL_3.COL_19 = TBL_2.COL_19\nleft outer join SCHEMA_1.TBL_5 on\n    TBL_5.COL_14 = TBL_3.COL_22\n\
    left outer join SCHEMA_1.TBL_4 on\n    TBL_3.COL_36 = TBL_4.COL_36\nleft outer join SCHEMA_1.TBL_1\
    \ on\n    TBL_1.COL_19 = TBL_2.COL_19\nWhere\n    TBL_2.COL_9 = @VAR_41\nEND;"
