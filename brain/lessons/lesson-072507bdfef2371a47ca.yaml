    \ AS ALIAS_1\n\tJOIN SCHEMA_1.TBL_1 AS ALIAS_2\n\t\tON CONCAT('TEXT_LITERAL_9', ALIAS_1.COL_11, 'TEXT_LITERAL_10',\
