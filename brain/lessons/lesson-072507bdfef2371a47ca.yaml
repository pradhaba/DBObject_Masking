  source_masked: "create PROCEDURE SCHEMA_1.PROC_4( \n\tin @PARAM_20 char(1) default 'TEXT_LITERAL_1',\n\
    \tin @PARAM_19 char(1) default 'TEXT_LITERAL_2',\n\tin @PARAM_21 char(1) default 'TEXT_LITERAL_2'\n\
    )\nresult(\n\tCOL_13 varchar(25),\n\tCOL_16 char(100),\n\tCOL_15 INTEGER /* WAS SMALL */,\n\tCOL_14\
    \ INTEGER /* WAS SMALL */,\n\tCOL_18 char(1),\n\tCOL_7 char(1),\n\tCOL_6 INTEGER /* WAS SMALL */,\n\
    \tCOL_17 tinyint,\n\tCOL_12 char(100),\n\tCOL_8 INTEGER /* WAS SMALL */\n)\nbegin\n    //******************************************************\n\
    \    // Created:  21.06.2021 By: DiS\n    // SIR:      #27883\n    // What:\t TBL_2 list to select\
    \ one for schedule\n    // Prepared: 06.08.2021 By Gritsenko\n    // SIR: #22336 File : WEBR3_001.sql\n\
    \    //******************************************************\n    // Modified: 10.08.2021 By: DiS\n\
    \    // SIR:      #27883\n    // What: \t COL_8 added into TBL_3\n    // Prepared: 24.08.2021 By Gritsenko\n\
    \    // SIR: #22336 File : WEBR3_004.sql\n    // ******************************************************\n\
    \    // Modified:\t27.04.2022\t\tBy: Gritsenko\t\n    // What : compute report name\n    // SIR: \t\
    29868#note-24 \n    // Prepared: 28.04.2022 By Gritsenko\n    // SIR: #22336 File : WEBR3_055.sql\n\
    \    // ******************************************************\n    DECLARE @VAR_22 int;\n\nSET\n\
    @VAR_22 = VAR_24;\n--\n\tSELECT\tTBL_2.COL_13,   \n\t\t\t(case\n    TBL_2.COL_13\n\t\t\t\twhen 'TEXT_LITERAL_3'\
    \ then (CASE\n        WHEN VAR_23 = 1 THEN 'TEXT_LITERAL_4'\n        ELSE 'TEXT_LITERAL_5'\n    END)\n\
    \    when 'TEXT_LITERAL_6' then (CASE\n        WHEN VAR_23 = 1 THEN 'TEXT_LITERAL_7'\n        ELSE\
    \ 'TEXT_LITERAL_8'\n    END)\n    else w3_get_report_name(COL_13)\nend) as COL_16,\n\t\t\tTBL_2.COL_15,\n\
    \t\t\tTBL_2.COL_14,\n\t\t\tTBL_2.COL_18,\n\t\t\tTBL_2.COL_7,  \n\t\t\tTBL_1.COL_6, \n\t\t\tTBL_2.COL_17,\n\
    \t\t\tw3_get_report_name(COL_13) as COL_12,\n            SCHEMA_1.wa_get_access( @VAR_22, \n     \
    \                           0, \n                                string('TEXT_LITERAL_9', TBL_2.COL_11,\
    \ 'TEXT_LITERAL_10', TBL_2.COL_13), \n                                'TEXT_LITERAL_11') \n      \
    \      as COL_8\nFROM\nSCHEMA_1.TBL_2,\nSCHEMA_1.TBL_1\nWHERE\nstring('TEXT_LITERAL_9', TBL_2.COL_11,\
    \ 'TEXT_LITERAL_10', TBL_2.COL_13) = TBL_1.COL_5\nand TBL_2.COL_9 = 'TEXT_LITERAL_12'\nand TBL_2.COL_10\
    \ = 'TEXT_LITERAL_12'\nand (@PARAM_20 <> 'TEXT_LITERAL_1'\n    or COL_13 <> 'TEXT_LITERAL_13')\nand\
    \ (LEN(@PARAM_19) > 0\n    or COL_13 <> 'TEXT_LITERAL_6')\nand (LEN(@PARAM_21) > 0\n    or COL_13\
    \ <> 'TEXT_LITERAL_14')\nORDER BY\nCOL_16\n;\nend;"
